name: CI — Lint, Test, Build, Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx jest --config jest.config.cjs --ci --coverage
      - name: Check test coverage threshold
        run: |
          npx jest --config jest.config.cjs --ci --coverage --coverageReporters=text | tee coverage.txt
          # Fail if total coverage < 50%
          COVERAGE=$(grep "All files" coverage.txt | awk '{print $10}' | tr -d '%')
          if [ -n "$COVERAGE" ] && [ "$(echo "$COVERAGE < 50" | bc)" = "1" ]; then
            echo "Coverage $COVERAGE% is below 50% threshold"
            exit 1
          fi

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - name: Report vulnerabilities
        run: npm audit --json > audit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
